name: Deploy to Production

on:
  # push trigger will be enabled after the runner + deploy script are tested
  workflow_dispatch:

concurrency:
  group: mosla-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Office server runner (192.168.245.25 is private, GitHub-hosted runners can't reach it)
    runs-on: [self-hosted, mosla-deploy]
    timeout-minutes: 20
    steps:
      - name: Deploy on server
        run: bash /var/www/mosla-ghor/deploy-docker.sh